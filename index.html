<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Amazon Deals</title>
  <meta name="description" content="Browse Amazon deals with fast CDN-cached product data.">
  <link rel="preconnect" href="https://images.amazon.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="toolbar">
      <div class="brand">Product Grid</div>
      <label class="search-wrap" aria-label="Search products">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Search products, ASIN or category…" autocomplete="off">
      </label>
      <select id="category" aria-label="Filter by category">
        <option value="">All categories</option>
      </select>
    </div>
  </header>

  <main>
    <div class="statusbar">
      <div id="count">Loading deals…</div>
      <button id="loadAll" class="ghost">Load all</button>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="sentinel" class="sentinel">Loading…</div>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="discount"></div>
      <a class="image-box" target="_blank" rel="noopener sponsored">
        <img loading="lazy" decoding="async" alt="">
      </a>
      <div class="card-body">
        <a class="title" target="_blank" rel="noopener sponsored"></a>
        <div class="mrp-row">MRP: <span class="mrp"></span></div>
        <div class="deal-row">Deal Price: <strong class="deal"></strong></div>
        <div class="validity"></div>
        <a class="buy" target="_blank" rel="noopener sponsored">Buy Now</a>
      </div>
    </article>
  </template>

  <script src="config.js"></script>
  <script src="deal-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
